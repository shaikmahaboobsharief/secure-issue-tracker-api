spring.application.name=secure-issue-tracker

# DATABASE (SQL Server)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=secure_issue_tracker;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection Pool 
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000


# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

# Disable SQL logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Hibernate noise logs
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# JWT CONFIG
jwt.secret=${JWT_SECRET}
jwt.expiration=900000


# LOGGING
logging.level.root=INFO
logging.level.com.sharief.secure_issue_tracker=DEBUG
logging.level.org.springframework.security=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# SERVER
server.port=8080


# SWAGGER (OPTIONAL CLEAN PATH)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html